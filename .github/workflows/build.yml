name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore LinuxInstallHelper.sln

      - name: Build (Release)
        run: dotnet build LinuxInstallHelper.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/LinuxInstallHelper.Core.Tests/LinuxInstallHelper.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish self-contained
        run: >-
          dotnet publish src/LinuxInstallHelper.App/LinuxInstallHelper.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -o artifacts/publish/${{ matrix.rid }}

      - name: Create zip
        shell: pwsh
        run: |
          $zip = "artifacts/LinuxInstallHelper-${{ matrix.rid }}.zip"
          Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/*" -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem "artifacts/publish/${{ matrix.rid }}" -Recurse -File | Measure-Object -Property Length -Sum |
            ForEach-Object { "Published files: $($_.Count), $([math]::Round($_.Sum / 1MB, 1)) MB" }
          "Zip: $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"
          (Get-FileHash $zip -Algorithm SHA256).Hash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts/LinuxInstallHelper-${{ matrix.rid }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
