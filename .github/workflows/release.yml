name: Release

on:
  push:
    tags: ['v*', 'V*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v', 'V')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests/LinuxInstallHelper.Core.Tests/LinuxInstallHelper.Core.Tests.csproj -c Release

      - name: Publish self-contained
        run: >-
          dotnet publish src/LinuxInstallHelper.App/LinuxInstallHelper.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/publish/${{ matrix.rid }}

      # The whole release is one .exe: the launcher, which carries the published folder.
      - name: Single executable
        shell: pwsh
        run: ./tools/ci/build-launcher.ps1 -Publish "artifacts/publish/${{ matrix.rid }}" -Rid ${{ matrix.rid }} -Version ${{ steps.version.outputs.value }} -Output "artifacts/LinuxInstallHelper-${{ steps.version.outputs.value }}-${{ matrix.rid }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # Only the .exe files are attached; their SHA-256 goes into the release notes.
      - name: Write release notes
        working-directory: dist
        run: |
          {
            echo "Download \`LinuxInstallHelper-*-win-x64.exe\` (or \`win-arm64\` for ARM PCs) and run it: nothing to install."
            echo
            echo "SHA-256:"
            echo '```'
            sha256sum *.exe
            echo '```'
          } > ../notes.md
          cat ../notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # A release made by hand for this tag: keep it and replace its files.
            gh release edit "$TAG" --repo "$REPO" --title "Linux Install Helper $TAG" --notes-file notes.md --draft=false
            gh release upload "$TAG" dist/*.exe --repo "$REPO" --clobber
          else
            prerelease=""
            if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
            gh release create "$TAG" dist/*.exe --repo "$REPO" --title "Linux Install Helper $TAG" \
              --notes-file notes.md --generate-notes --verify-tag $prerelease
          fi
