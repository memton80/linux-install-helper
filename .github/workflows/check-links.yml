name: Check catalog links

on:
  schedule:
    - cron: '17 6 * * 1' # every Monday at 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - 'catalog/**'
      - 'tools/LinuxInstallHelper.LinkChecker/**'
      - '.github/workflows/check-links.yml'
  pull_request:
    paths:
      - 'catalog/**'
      - 'tools/LinuxInstallHelper.LinkChecker/**'
      - '.github/workflows/check-links.yml'

permissions:
  contents: read

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  check:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      failed: ${{ steps.check.outcome == 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build link checker
        run: dotnet build tools/LinuxInstallHelper.LinkChecker/LinuxInstallHelper.LinkChecker.csproj -c Release

      - name: Check every download
        id: check
        continue-on-error: true
        run: >-
          dotnet run --project tools/LinuxInstallHelper.LinkChecker/LinuxInstallHelper.LinkChecker.csproj
          -c Release --no-build --
          --catalog catalog/distros.json
          --report link-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-report
          path: link-report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail when a link is broken
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::At least one catalog download is broken, see the job summary."
          exit 1

  report:
    name: Open or update the issue
    needs: check
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: catalog-links
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: link-report
          path: report

      - name: Open, update or close the issue
        env:
          FAILED: ${{ needs.check.outputs.failed }}
        run: |
          gh label create "$LABEL" --color D93F0B --description "Broken download in the distribution catalog" --force
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          body="$(cat report/link-report.md 2>/dev/null || echo 'No report was produced.')"$'\n\n'"Run: $RUN_URL"

          if [[ "$FAILED" == "true" ]]; then
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "Broken links in the distribution catalog" --label "$LABEL" --body "$body"
            fi
          elif [[ -n "$existing" ]]; then
            gh issue close "$existing" --comment "All catalog links work again."$'\n\n'"Run: $RUN_URL"
          fi
