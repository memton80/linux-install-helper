name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore LinuxInstallHelper.sln

      - name: Build (Release)
        run: dotnet build LinuxInstallHelper.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/LinuxInstallHelper.Core.Tests/LinuxInstallHelper.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      # Raw writes through Windows itself, on a blank virtual disk and on one with a mounted volume.
      - name: Attach virtual disks
        shell: pwsh
        run: ./tools/ci/attach-test-disks.ps1

      - name: Raw write tests
        run: >-
          dotnet test tests/LinuxInstallHelper.Core.Tests/LinuxInstallHelper.Core.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~WindowsRawDiskAccessTests"
          --logger "console;verbosity=detailed"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish self-contained
        run: >-
          dotnet publish src/LinuxInstallHelper.App/LinuxInstallHelper.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -o artifacts/publish/${{ matrix.rid }}

      # The release is a single .exe: the launcher, which carries the published folder as a zip.
      - name: Single executable
        shell: pwsh
        run: ./tools/ci/build-launcher.ps1 -Publish "artifacts/publish/${{ matrix.rid }}" -Rid ${{ matrix.rid }} -Output "artifacts/single/LinuxInstallHelper-${{ matrix.rid }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts/single/LinuxInstallHelper-${{ matrix.rid }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      # The x64 build can run on the runner: start it on several pages to catch startup crashes.
      - name: Smoke test and screenshots
        if: matrix.platform == 'x64'
        timeout-minutes: 8
        shell: pwsh
        run: |
          ./tools/ci/smoke-test.ps1 -Exe "artifacts/publish/${{ matrix.rid }}/LinuxInstallHelper.exe" -Output artifacts/screenshots
          ./tools/ci/smoke-test.ps1 -Exe "artifacts/single/LinuxInstallHelper-${{ matrix.rid }}.exe" -Output artifacts/screenshots -Launcher

      - name: Application log
        if: always() && matrix.platform == 'x64'
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA "LinuxInstallHelper\logs"
          if (Test-Path $logs) { Get-ChildItem $logs -Filter *.log | ForEach-Object { Get-Content $_.FullName -Tail 200 } }
          else { "No log folder." }

      - name: Upload screenshots
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 14
